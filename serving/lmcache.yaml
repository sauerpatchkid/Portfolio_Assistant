# LMCache settings for the in-process fallback (serving/vllm_lmcache_inprocess.sh).
# KV cache is stored in 256-token chunks, in CPU RAM first and on local disk second.
chunk_size: 256
local_cpu: true
max_local_cpu_size: 4.0          # GB of CPU RAM (about 27,000 tokens of KV cache for the 8B model)
local_disk: "file:///content/lmcache_disk/"
max_local_disk_size: 30.0        # GB of disk
